name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      OPENSPOOR_TEST_REQUIRE_DB: "1"
      OPENSPOOR_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      OPENSPOOR_TEST_DATABASE_URL: postgres://openspoor:openspoor@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Create non-superuser app role (RLS is enforced for it)
        run: psql "$OPENSPOOR_TEST_ADMIN_URL" -c "create role openspoor login password 'openspoor' createdb"
      - run: go build ./...
      - run: go vet ./...
      - name: Tests (unit + integration against PostgreSQL 16)
        run: go test -race -count=1 -coverpkg=./internal/...,./pkg/... -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - name: Coverage gate (every domain package under internal/ and pkg/ must reach 80 %)
        # Computed from coverage.out: cmd/, internal/testkit, *test helper packages and generated files are excluded.
        # See scripts/coverage-gate.sh; COVERAGE_MIN overrides the threshold.
        run: ../scripts/coverage-gate.sh coverage.out 80
      - name: Keep the coverage profile
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-backend
          path: backend/coverage.out
          retention-days: 14
          if-no-files-found: ignore
      - name: Tests in saas and hub mode, on Testcontainers PostgreSQL (single runs above on the service)
        run: |
          env -u OPENSPOOR_TEST_ADMIN_URL -u OPENSPOOR_TEST_DATABASE_URL OPENSPOOR_TEST_MODE=saas go test -count=1 ./...
          env -u OPENSPOOR_TEST_ADMIN_URL -u OPENSPOOR_TEST_DATABASE_URL OPENSPOOR_TEST_MODE=hub go test -count=1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          working-directory: backend
          version: v2.15.0
      - name: go-arch-lint (module boundaries)
        run: |
          go install github.com/fe3dback/go-arch-lint@v1.19.0
          go-arch-lint check
      - name: govulncheck (known vulnerabilities in code that is actually called)
        # Fails (exit 3) only for vulnerabilities whose vulnerable symbol is reachable from this module;
        # advisories for imported-but-uncalled packages are listed without failing the job.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: OpenAPI diff against main
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          git show origin/${{ github.base_ref }}:backend/internal/app/openapi.yaml > /tmp/base.yaml || exit 0
          docker run --rm -v /tmp:/base -v $PWD/internal/app:/head tufin/oasdiff breaking /base/base.yaml /head/openapi.yaml --fail-on ERR

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production dependencies, high and critical advisories fail the job)
        run: pnpm audit --prod --audit-level high
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

  sbom:
    # Software bills of materials in CycloneDX JSON, uploaded as a workflow artifact on every run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install SBOM tools (pinned)
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          go install github.com/anchore/syft/cmd/syft@v1.52.0
      - name: Backend SBOM (modules that go into the openspoor binary)
        working-directory: backend
        env:
          CGO_ENABLED: "0"
        run: cyclonedx-gomod app -json -output ../sbom-backend.cdx.json -main cmd/openspoor .
      - name: Frontend SBOM (from frontend/pnpm-lock.yaml)
        run: syft scan dir:frontend --exclude './**/node_modules/**' -o cyclonedx-json=sbom-frontend.cdx.json
      - name: Check that both SBOMs list components
        run: |
          for f in sbom-backend.cdx.json sbom-frontend.cdx.json; do
            n=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1])).get('components', [])))" "$f")
            echo "$f: $n components"
            test "$n" -gt 0
          done
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sbom
          path: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json
          retention-days: 90
