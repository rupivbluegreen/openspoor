apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openspoor.name" . }}-worker
  labels: {{- include "openspoor.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: {{- include "openspoor.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "openspoor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom: [{ secretRef: { name: {{ .Values.existingSecret }} } }]
          env: {{- include "openspoor.env" . | nindent 12 }}
            - name: OPENSPOOR_WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            {{- if .Values.federationClient.enabled }}
            - name: OPENSPOOR_TLS_CLIENT_CERT
              value: /etc/openspoor/federation/tls.crt
            - name: OPENSPOOR_TLS_CLIENT_KEY
              value: /etc/openspoor/federation/tls.key
            - name: OPENSPOOR_TLS_MIN_VERSION
              value: {{ .Values.tls.minVersion | quote }}
            {{- if .Values.federationClient.peerCA }}
            - name: OPENSPOOR_TLS_PEER_CA
              value: /etc/openspoor/federation/ca.crt
            {{- end }}
            {{- end }}
          ports: [{ name: http, containerPort: 8080 }]
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if .Values.federationClient.enabled }}
          volumeMounts: [{ name: federation, mountPath: /etc/openspoor/federation, readOnly: true }]
      volumes: [{ name: federation, secret: { secretName: {{ .Values.federationClient.secretName }} } }]
          {{- end }}
