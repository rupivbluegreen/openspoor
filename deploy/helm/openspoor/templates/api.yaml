apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openspoor.name" . }}-api
  labels: {{- include "openspoor.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: {{- include "openspoor.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "openspoor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom: [{ secretRef: { name: {{ .Values.existingSecret }} } }]
          env: {{- include "openspoor.env" . | nindent 12 }}
            - name: OPENSPOOR_WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            {{- if .Values.tls.enabled }}
            - name: OPENSPOOR_TLS_CERT
              value: /etc/openspoor/tls/tls.crt
            - name: OPENSPOOR_TLS_KEY
              value: /etc/openspoor/tls/tls.key
            - name: OPENSPOOR_TLS_MIN_VERSION
              value: {{ .Values.tls.minVersion | quote }}
            {{- if .Values.tls.clientCA }}
            - name: OPENSPOOR_TLS_CLIENT_CA
              value: /etc/openspoor/tls/ca.crt
            {{- end }}
            {{- end }}
          ports: [{ name: http, containerPort: 8080 }]
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /readyz, port: http{{ if .Values.tls.enabled }}, scheme: HTTPS{{ end }} }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http{{ if .Values.tls.enabled }}, scheme: HTTPS{{ end }} }, periodSeconds: 10 }
          {{- if .Values.tls.enabled }}
          volumeMounts: [{ name: tls, mountPath: /etc/openspoor/tls, readOnly: true }]
          {{- end }}
      {{- if .Values.tls.enabled }}
      volumes: [{ name: tls, secret: { secretName: {{ .Values.tls.secretName }} } }]
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openspoor.name" . }}
  labels: {{- include "openspoor.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]
