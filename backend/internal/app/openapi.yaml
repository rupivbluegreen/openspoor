components:
    responses:
        Problem:
            content:
                application/problem+json:
                    schema:
                        properties:
                            errors: {}
                            status:
                                type: integer
                            title:
                                type: string
                        required:
                            - title
                            - status
                        type: object
            description: RFC 9457 problem document
    securitySchemes:
        apiKey:
            in: header
            name: X-API-Key
            type: apiKey
        bearer:
            bearerFormat: JWT
            scheme: bearer
            type: http
info:
    description: Open Agentic Supply Chain OS. Generated from the router (`go run ./cmd/openspoor openapi`); every endpoint is listed.
    license:
        identifier: Apache-2.0
        name: Apache-2.0
    title: Open Spoor API
    version: 1.0.0
openapi: 3.1.0
