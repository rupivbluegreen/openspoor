# Module boundaries: modules depend on core and on other modules' exported
# interfaces only in the directions listed here (no cycles, no reaching into internals).
version: 3
workdir: .
# Black-box tests (package x_test) import testkit and the module under test; boundaries apply to production code.
excludeFiles:
  - "^.*_test\\.go$"
allow:
  depOnAnyVendor: true
  # core/auth declares the user-store interface that app wires to platform (dependency inversion);
  # deep scan reports that injection as platform -> core, so only import edges are checked.
  deepScan: false
components:
  cmd:           { in: cmd/** }
  app:           { in: internal/app }
  core:          { in: internal/core/** }
  testkit:       { in: internal/testkit }
  platform:      { in: internal/platform }
  masterdata:    { in: internal/masterdata }
  serialization: { in: internal/serialization }
  epcis:         { in: internal/epcis }
  trace:         { in: internal/trace }
  dscsa:         { in: internal/dscsa }
  connectors:    { in: internal/connectors }
  hubjson:       { in: internal/connectors/hubjson }
  adapters:      { in: internal/connectors/* }
  partners:      { in: internal/partners }
  saas:          { in: internal/saas }
  food:          { in: internal/food }
  link:          { in: internal/link }
  act:           { in: internal/act }
  ecosystem:     { in: internal/ecosystem }
  verify:        { in: internal/verify }
  pkg:           { in: pkg/** }
  migrations:    { in: migrations }
  migration:     { in: internal/migration }
  rulepacks:     { in: rulepacks }
commonComponents: [core, pkg]
# Components absent from deps (platform, masterdata, trace, partners, migrations, rulepacks) are leaves:
# they may use only the common components.
deps:
  cmd:           { mayDependOn: [app, platform, migrations] }
  app:           { anyProjectDeps: true }
  testkit:       { mayDependOn: [app, platform, migrations] }
  serialization: { mayDependOn: [masterdata] }
  epcis:         { mayDependOn: [masterdata, serialization] }
  dscsa:         { mayDependOn: [masterdata, epcis, trace, partners] }
  connectors:    { mayDependOn: [adapters, masterdata, trace, rulepacks] }
  # Connectors for hubs with onboarding-only specs share the placeholder JSON engine.
  adapters:      { mayDependOn: [hubjson] }
  saas:          { mayDependOn: [platform] }
  food:          { mayDependOn: [epcis] }
  link:          { mayDependOn: [epcis, partners] }
  act:           { mayDependOn: [connectors, trace] }
  ecosystem:     { mayDependOn: [epcis, platform] }
  verify:        { mayDependOn: [masterdata, serialization, trace] }
  migration:     { mayDependOn: [epcis, trace] }
