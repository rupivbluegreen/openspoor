# EU Deforestation Regulation.
id: eu-eudr
name: EU Deforestation Regulation
version: "2026.1"
market: EU
vertical: food
sources:
  - title: Regulation (EU) 2023/1115
    url: https://eur-lex.europa.eu/eli/reg/2023/1115/oj
rules:
  - id: geolocation
    description: Due diligence statements include the geolocation of all plots of land where the commodity was produced.
    source: "Regulation 2023/1115, Art. 9(1)(d)"
    appliesTo: dds
    check: { field: has_geolocation, op: eq, value: true }
    severity: error
  - id: polygon-over-4ha
    description: Plots of more than four hectares used for production other than cattle are described with polygons.
    source: "Regulation 2023/1115, Art. 2(28)"
    appliesTo: plot
    check: { field: polygon_if_over_4ha, op: eq, value: true }
    severity: error
  - id: retention-5y
    description: Keep due diligence documentation for five years.
    source: "Regulation 2023/1115, Art. 12(3)"
    appliesTo: info
    severity: info
retentionYears: 5
